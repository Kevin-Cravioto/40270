<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora gg</title>
    <link rel="stylesheet" href="javascript-02.css"
</head>

<body>
    <h1>Calculadora</h1>
    
    <!-- button{$}[id="b$"]*10-->
    <div>
        <input type="text" id="resultado">
        <button id="b1" class="numeros">1</button><button id="b2" class="numeros">2</button><button id="b3" class="numeros">3</button><button id="b4" class="numeros">4</button><button id="b5" class="numeros">5</button><button id="b6" class="numeros">6</button><button id="b7" class="numeros">7</button><button id="b8" class="numeros">8</button><button id="b9" class="numeros">9</button><button id="b0" class="numeros">0</button>

    </div>

    <div>
        <button id="sum" class="operadores">+</button>
        <button id="rest" class="operadores">-</button>
        <button id="mult" class="operadores">x</button>
        <button id="div" class="operadores">/</button>
        <button id="borra" class="operadores">ac</button>
        <button id="igual" class="operadores">=</button>
    </div>

    <script src="javascript-02.js"></script>
</body>
</html>
